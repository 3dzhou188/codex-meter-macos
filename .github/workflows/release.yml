name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v2.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build app
        run: ./scripts/build-app.sh
      - name: Package app
        run: |
          version="$RELEASE_TAG"
          version="${version#v}"
          archive="dist/Codex-Meter-macOS-arm64-${version}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Codex Meter.app" "$archive"
          shasum -a 256 "$archive" | tee dist/SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          ## 中文

          Codex Meter 2.0 增加 Codex Agent 状态灯，可在菜单栏显示额度与 Agent 活动状态，并支持“额度 + Agent”“仅额度”“仅 Agent”三种显示模式。

          额度数据仍只来自 Codex 实时服务；`~/.codex/sessions` 仅用于读取 Codex 活动事件，明确忽略 `token_count`，不会读取 `~/.codex/auth.json`。

          Codex Agent 状态灯功能参考并受启发于 [Agent Signal Bar](https://github.com/guan-ops/Agent-Signal-Bar) 的本地优先 AI Agent 三色信号灯设计。Codex Meter 中的实现限定为 Codex 场景，并按本项目代码结构重新实现；不包含 Agent Signal Bar 的图片、声音、图标、截图、品牌素材或应用资源。

          下载 ZIP，解压后将应用移入“应用程序”文件夹。当前发布包采用临时签名，首次运行可能需要右键应用并选择“打开”。如果 macOS 仍提示“无法打开”或“已损坏”，可执行：

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Codex Meter.app"
          open "/Applications/Codex Meter.app"
          ```

          这是因为当前开源发布包尚未使用 Apple Developer ID 签名并公证。

          ## English

          Codex Meter 2.0 adds the Codex Agent status light, showing usage limits and Agent activity in the macOS menu bar, with display modes for usage + Agent, usage only, and Agent only.

          Usage data still comes only from the Codex realtime service. `~/.codex/sessions` is read only for Codex activity events, `token_count` is explicitly ignored, and `~/.codex/auth.json` is not read.

          The Codex Agent status light feature is inspired by [Agent Signal Bar](https://github.com/guan-ops/Agent-Signal-Bar) and its local-first red/yellow/green signal-light design for AI agents. Codex Meter's implementation is scoped to Codex and reimplemented in this project's own structure; it does not include Agent Signal Bar images, sounds, icons, screenshots, brand assets, or app resources.

          Download the ZIP, extract it, and move the app to Applications. Release builds are currently ad-hoc signed. On first launch, you may need to right-click the app and choose **Open**. If macOS still says the app cannot be opened or is damaged, run:

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Codex Meter.app"
          open "/Applications/Codex Meter.app"
          ```

          This is required because the current open-source release is not yet signed with an Apple Developer ID certificate and notarized.
          NOTES
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Codex Meter ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-notes.md
          files: |
            dist/Codex-Meter-macOS-arm64-*.zip
            dist/SHA256SUMS.txt
